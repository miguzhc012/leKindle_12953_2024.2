<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeKindle | Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/form.css">
    <link rel="stylesheet" href="./css/cad.css">
    <script src="./js/main.js" defer></script>
    <link rel="shortcut icon" href="./Image/favicon_io/favicon.ico" type="image/x-icon">
</head>

<body>

    <nav class="navbar sticky-top navbar-expand-lg nav-top navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container">
          <!-- <a class="navbar-brand" href="#">Navbar</a> -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="index.html#cards">Galeria</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="index.html#agenda">Agenda</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="index.html#contact">Contato</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./login.html">Entrar</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    <section class="container">
        <h1>
            Seja Bem-Vindo à Nossa Comunidade de Leitores!
        </h1>
        <form class="row g-3 formscad">
            <div class="form-floating mb-3 col-md-6">
                <input type="text" class="form-control" id="Nome" placeholder="Nome completo" aria-describedby="nomeHelp">
                <label for="nome">Nome completo:</label>
            </div>

            <div class="form-floating mb-3 col-md-6">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" aria-describedby="emailHelp" min="1">
                <label for="email">E-mail:</label>  
            </div>

            <div class="form-floating mb-3 col-md-6">
                <input type="tel" class="form-control" id="floatingInput" placeholder="Telefone" aria-describedby="telefoneHelp">
                <label for="floatingInput">Número de telefone:</label>
              </div>

              <div class="form-floating col-md-6">
                    <input type="password" class="form-control" id="floatingPassword" aria-describedby="senhaHelp" placeholder="Senha" min="8">
                    <label for="floatingPassword">Senha:</label>
                    <div id="senhaHelp">
                        <p>*Minimo de 8 letras, com letras maúisculas e minúsculas, números e simbolos</p>
                    </div>
                </div>

              <div class="form-floating col-md-6">
                <input type="password" class="form-control" id="floatingPassword" aria-describedby="senhaHelp" placeholder="Senha" min="8">
                <label for="floatingPassword">Confirmar senha:</label>
                <div id="senhaHelp"></div>
              </div>
              <div>
                <div>
                    <p>
                        Genero
                    </p>
                </div>
                <div class="form-check col-12">
                    <input class="form-check-input" type="radio" name="genero" value="M" id="generoM">
                    <label class="form-check-label" for="generoM">
                    Masculino
                    </label>
                </div>
                <div class="form-check col-12">
                    <input class="form-check-input" type="radio" name="genero" value="F" id="generoF">
                    <label class="form-check-label" for="generoF">
                    Feminino
                    </label>
                </div>
                <div class="form-check col-12">
                    <input class="form-check-input" type="radio" name="genero" value="P" id="generoP" checked>
                    <label class="form-check-label" for="generoP">
                    Prefiro não responder
                    </label>
                </div>
            </div>

              <div>
                <label for="aniversario">Data de nascimento:</label>
                <input type="date" name="aniversario" id="aniversario">
              </div>

              <div>
                <div>
                    <p>
                        Quais são seus livros de interesse?
                    </p>
                </div>
                <div class="form-check col-12">
                    <label for="favT">Terror</label> 
                    <input type="checkbox" name="favT" id="favT">
                </div>
                <div class="form-check col-12">
                    <label for="favF">Ficção</label> 
                    <input type="checkbox" name="favF" id="favF">
                </div>
                <div class="form-check col-12">
                    <label for="favR">Romance</label> 
                    <input type="checkbox" name="favR" id="favR">
                </div>
                <div class="form-check col-12">
                    <label for="favS">Suspense</label> 
                    <input type="checkbox" name="favS" id="favS">
                </div>
                <div class="form-check col-12">
                    <label for="favO">Outros</label> 
                    <input type="checkbox" name="favO" id="favO">
                </div>

                <div class="col-12">
                    <button class="btn btn-primary">Criar conta</button>
                </div>
                
                <div>
                    <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
                </div>
                <div>
                    <p>Esqueceu sua senha? <a href="user-recovery.html">Recuperar senha</a></p>
                </div>
            </div>
        </form>
    </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
